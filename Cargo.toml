[workspace]
resolver = "2"
members = ["core", "daemon"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
