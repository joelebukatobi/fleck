[workspace]
resolver = "2"
members = ["core", "fleck"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Noisy for an application rather than a library.
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pixel and colour maths: window sizes and channels are small, bounded values.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# `just check` runs the tests in release, so one compiled copy of the
# dependency tree serves both checking and running Fleck rather than two. That
# would otherwise drop the arithmetic checks the tests rely on, so they stay on;
# for an app that spends its time waiting for a keystroke, the cost is nothing.
[profile.release]
overflow-checks = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
