name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build needs these; libpulse for sound, cmake and libclang for the
      # bindgen whisper-rs runs. desktop-file-utils and appstream are for
      # `just validate`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libexpat1-dev libfreetype6-dev libpulse-dev \
            cmake libclang-dev desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2

      # Exactly what a contributor runs before committing.
      - run: just check
