name: Release

# Tag a version and everything else happens here:
#   git tag -a v0.1.0 -m 'Fleck 0.1.0' && git push origin v0.1.0
#
# The .deb lands on the GitHub release, and on the apt repository this repo
# serves from its `gh-pages` branch, so existing users get it with their next
# `apt upgrade`. Needs one secret, APT_SIGNING_KEY: the armoured private key
# the repository indexes are signed with.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is built from the history

      # The same list CI installs, plus what whisper-rs needs to build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libexpat1-dev libfreetype6-dev cmake libclang-dev \
            apt-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2

      - name: Build the .deb
        id: build
        run: echo "deb=$(just deb | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: packaging/apt/changelog.sh > notes.md

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.deb }}
          body_path: notes.md

      # The branch holds only the apt repository, so it starts without a
      # history the first time and keeps one after that.
      - name: Check out the apt repository
        run: |
          git worktree add --no-checkout apt-repo
          cd apt-repo
          git checkout gh-pages || git checkout --orphan gh-pages

      - name: Import the signing key
        run: echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import

      - name: Publish to the apt repository
        run: |
          packaging/apt/publish.sh apt-repo "${{ steps.build.outputs.deb }}" notes.md
          cp packaging/apt/index.html apt-repo/index.html
          cp packaging/apt/fleck.gpg apt-repo/fleck.gpg
          # Pages would otherwise run the files through Jekyll, which drops
          # anything beginning with an underscore and rewrites nothing usefully.
          touch apt-repo/.nojekyll

      - name: Push it
        working-directory: apt-repo
        run: |
          git config user.name "Joel Onwuanaku"
          git config user.email "joelebuka@gmail.com"
          git add -A
          git commit -m "Fleck ${GITHUB_REF_NAME#v}"
          git push origin gh-pages
