name: Release

# Tag a version and everything else happens here:
#   git tag -a v0.1.0 -m 'Fleck 0.1.0' && git push origin v0.1.0
#
# The .deb lands on the GitHub release, and on the apt repository that
# joelebukatobi/fleck-apt serves through Pages, so existing users get it with
# their next `apt upgrade`. Needs two secrets:
#   APT_SIGNING_KEY   the armoured private key the repository is signed with
#   APT_REPO_TOKEN    a token with contents:write on joelebukatobi/fleck-apt
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  APT_REPO: joelebukatobi/fleck-apt

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is built from the history

      # The same list CI installs, plus what whisper-rs needs to build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libexpat1-dev libfreetype6-dev cmake libclang-dev \
            apt-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2

      - name: Build the .deb
        run: echo "deb=$(just deb | tail -1)" >> "$GITHUB_OUTPUT"
        id: build

      - name: Write the release notes
        id: notes
        run: packaging/apt/changelog.sh > notes.md

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.deb }}
          body_path: notes.md

      - name: Check out the apt repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APT_REPO }}
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Import the signing key
        run: |
          echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import
          gpg --list-secret-keys

      - name: Publish to the apt repository
        run: |
          packaging/apt/publish.sh apt-repo "${{ steps.build.outputs.deb }}" notes.md
          cp packaging/apt/index.html apt-repo/index.html
          cp packaging/apt/fleck.gpg apt-repo/fleck.gpg

      - name: Push it
        working-directory: apt-repo
        run: |
          git config user.name "Joel Onwuanaku"
          git config user.email "joelebuka@gmail.com"
          git add -A
          git commit -m "Fleck ${GITHUB_REF_NAME#v}"
          git push
