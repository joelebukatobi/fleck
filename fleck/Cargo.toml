[package]
name = "fleck"
description = "Sticky notes for the COSMIC desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fleck"
path = "src/main.rs"

[dependencies]
fleck-core = { path = "../core" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = ["winit", "wayland", "tokio", "applet"] }
serde.workspace = true
uuid.workspace = true
zbus.workspace = true
# Already in the dependency tree via zbus's `tokio` feature (zbus::block_on
# runs on it) - listed explicitly only so main.rs can reach `tokio::time::timeout`
# directly, not to add a second runtime.
tokio = { version = "1", default-features = false, features = ["time"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
whisper-rs = { version = "0.16.0", default-features = false }
# Recording and playback go through PulseAudio's simple API, which PipeWire
# serves on every COSMIC desktop. Asking the server for 16 kHz mono is what the
# pw-record command line used to do for us, and it works inside a Flatpak
# sandbox, where the recorder and player binaries do not exist.
libpulse-binding = { version = "2", default-features = false }
libpulse-simple-binding = { version = "2", default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
