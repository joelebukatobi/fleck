[package]
name = "fleck"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fleck"
path = "src/main.rs"

[dependencies]
fleck-core = { path = "../core" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "d4d71fd", features = ["winit", "wayland", "tokio", "applet"] }
serde.workspace = true
uuid.workspace = true
zbus.workspace = true
# Already in the dependency tree via zbus's `tokio` feature (zbus::block_on
# runs on it) - listed explicitly only so main.rs can reach `tokio::time::timeout`
# directly, not to add a second runtime.
tokio = { version = "1", default-features = false, features = ["time"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
